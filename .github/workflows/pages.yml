name: Publish Hollow Geometry

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check public repository content
        run: python3 scripts/audit-repository.py
      - name: Read Pages URL
        uses: actions/configure-pages@v5
        id: pages
      - name: Prepare static site and social card metadata
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          METRICA_COUNTER_ID: ${{ vars.METRICA_COUNTER_ID }}
        run: python3 scripts/prepare-pages.py --url "$SITE_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
