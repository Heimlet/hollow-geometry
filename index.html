<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Куб Метатрона — 3D Сакральная Геометрия</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<header id="app-toolbar" aria-label="Управление сценой">
  <button class="fbtn" id="sb-toggle" aria-label="Открыть или скрыть настройки" title="Открыть или скрыть настройки" aria-controls="sidebar" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
  <div class="hdr-btns">
    <button disabled onclick="toggleAll(true)">Вкл. всё</button>
    <button disabled onclick="toggleAll(false)">Выкл. всё</button>
    <button disabled onclick="resetCamera()" title="Сбросить ракурс текущего раздела">⟲ Камера</button>
  </div>
  <div class="history-buttons" aria-label="История действий">
    <button id="undo" disabled aria-label="Отменить действие" title="Отменить · Ctrl / ⌘ Z">↶</button>
    <button id="redo" disabled aria-label="Повторить действие" title="Повторить · Ctrl / ⌘ Shift Z">↷</button>
  </div>
  <span id="view-context" title="Ракурс, масштаб и перспектива запоминаются для каждого раздела"></span>
</header>
<div id="sidebar">
  <div class="sb-head">
    <h1>✡ Куб Метатрона</h1>
    <p>Исследуйте форму, симметрию и пропорции</p>
    <nav id="section-nav" aria-label="Разделы исследования"></nav>
    <div id="scene-status" role="status"></div>
  </div>
  <div id="groups"></div>
</div>
<div id="info"></div>
<div id="proj-label"></div>
<button class="fbtn" id="fs-btn" title="Полный экран" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶</button>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
}}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
